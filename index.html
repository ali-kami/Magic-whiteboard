<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>MagicBoard</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- The whiteboard: full-window white canvas. Strokes are drawn here. -->
  <canvas id="board"></canvas>

  <!-- Cursor layer on top of the board (kept separate so the board's
       drawing is never wiped when the cursor moves) -->
  <canvas id="cursor"></canvas>

  <!-- Small camera preview, bottom-right. Press 'c' to show/hide. -->
  <div id="preview">
    <video id="video" autoplay playsinline muted></video>
    <canvas id="overlay"></canvas>
  </div>

  <!-- Info box, top-left -->
  <div id="info" hidden>
    <div>FPS: <span id="fps">0</span></div>
    <div>Hand detected: <span id="hand">no</span></div>
    <div>Thumb–Index: <span id="distTI">–</span></div>
    <div>Thumb–Middle: <span id="distTM">–</span></div>
    <div>Cursor: <span id="cursorPos">–</span></div>
    <div>Mode: <span id="mode">–</span></div>
    <div>Smoothing: <span id="smoothing">on</span></div>
    <div>Hand size: <span id="handSize">–</span> px (raw / smooth)</div>
    <div>Thickness: <span id="thickness">–</span></div>
  </div>

  <!-- Status / error message, centered on screen -->
  <div id="message">Starting…</div>

  <script type="module" src="main.js"></script>
</body>
</html>
